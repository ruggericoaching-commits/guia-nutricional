<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guía Nutricional</title>
  <meta name="description" content="Tu guía nutricional personalizada: plan, comidas afuera, hábitos y progreso.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <meta name="apple-mobile-web-app-title" content="Mi Guía">
  <script>
    // En iPhone/iPad no se declara el manifest: así "Agregar a inicio" guarda el link completo del plan
    (function () {
      var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!ios) { var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l); }
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"><div class="boot"></div></div>
